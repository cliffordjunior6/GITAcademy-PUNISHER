server {
    listen 80;
    listen [::]:80;
    server_name api.GITAcademy.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.GITAcademy.com;

    root /var/www/GITAcademy-api/public;
    index index.php;

    # SSL certificates (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/api.GITAcademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.GITAcademy.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/GITAcademy-api.access.log;
    error_log  /var/log/nginx/GITAcademy-api.error.log;

    # Max upload size (for video uploads)
    client_max_body_size 4096M;
    client_body_timeout  300s;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Route all requests through Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Block access to .env and other sensitive files
    location ~ /\. {
        deny all;
    }
    location ~ /(composer\.json|composer\.lock|artisan) {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Paystack / Stripe webhook — skip rate limiting
    location /api/payments/webhook {
        try_files $uri $uri/ /index.php?$query_string;
        # No rate limiting for webhooks
    }
}


# ── Frontend (serve from same server or separate) ─────────────────────────
server {
    listen 443 ssl http2;
    server_name GITAcademy.com www.GITAcademy.com;

    ssl_certificate     /etc/letsencrypt/live/GITAcademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/GITAcademy.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/GITAcademy-frontend;
    index index.html GITAcademy_responsive.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|json|png|jpg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
