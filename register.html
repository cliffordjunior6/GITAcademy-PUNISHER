<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — GITAcademy</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#0d0d0f; --cream:#f5f0e8; --gold:#e8c547; --moss:#2d4a3e; --rust:#c4522a; --paper:#faf8f3; --smoke:#f0ece4; --error:#e05555; --font-display:'Fraunces',Georgia,serif; --font-body:'DM Sans',system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--font-body); background:linear-gradient(135deg,#f5f0e8,#f0ece4); color:var(--ink); }
    .shell { min-height:100vh; display:grid; place-items:center; padding:32px 20px; }
    .card { width:min(560px, 100%); background:rgba(255,255,255,.9); border:1px solid rgba(13,13,15,.08); border-radius:24px; box-shadow:0 16px 48px rgba(13,13,15,.08); padding:32px; }
    h1 { font-family:var(--font-display); font-size:2.3rem; margin:6px 0 12px; letter-spacing:-.04em; }
    .eyebrow { display:inline-flex; background:rgba(196,82,42,.08); color:var(--rust); border-radius:999px; padding:8px 12px; font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; font-weight:700; }
    .sub { color:rgba(13,13,15,.65); margin-bottom:24px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    label { display:block; font-size:.82rem; font-weight:600; margin-bottom:8px; }
    input { width:100%; border:1px solid rgba(13,13,15,.12); border-radius:12px; background:#fff; padding:14px 16px; font-size:1rem; font-family:inherit; }
    input:focus { outline:none; border-color:var(--moss); box-shadow:0 0 0 3px rgba(45,74,62,.08); }
    .full { grid-column:1 / -1; }
    .check { display:flex; align-items:center; gap:10px; margin:18px 0 10px; font-size:.85rem; color:rgba(13,13,15,.7); }
    .primary { width:100%; border:none; border-radius:14px; background:var(--ink); color:#fff; padding:16px; font-weight:700; cursor:pointer; }
    .secondary { text-align:center; margin-top:18px; font-size:.9rem; color:rgba(13,13,15,.65);} .secondary a { color:var(--rust); font-weight:600; }
    .error { display:none; background:#fff0f0; color:#a82626; border:1px solid rgba(224,85,85,.3); border-radius:10px; padding:10px 12px; margin-bottom:14px; font-size:.85rem; }
    @media (max-width: 600px) { .grid { grid-template-columns:1fr; } .card { padding:24px 18px; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="eyebrow">Join GITAcademy</div>
      <h1>Create your account</h1>
      <p class="sub">Start your learning journey and access Ghanaian-market priced courses in ₵.</p>

      <div id="registerError" class="error" aria-live="polite"></div>

      <div class="grid">
        <div>
          <label for="firstName">First name</label>
          <input id="firstName" type="text" placeholder="Ama" />
        </div>
        <div>
          <label for="lastName">Last name</label>
          <input id="lastName" type="text" placeholder="Kofi" />
        </div>
        <div class="full">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@example.com" />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Create a password" />
        </div>
        <div>
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" type="password" placeholder="Repeat password" />
        </div>
      </div>

      <label class="check"><input id="terms" type="checkbox" /> I agree to the Terms of Service and Privacy Policy.</label>
      <button id="registerBtn" class="primary" type="button">Create my account</button>
      <div class="secondary">Already have an account? <a href="login.html">Sign in</a></div>
    </div>
  </div>

  <script>
    window.GITAcademy_API_URL = 'api.php';
    const registerBtn = document.getElementById('registerBtn');
    const registerError = document.getElementById('registerError');

    function setError(message) {
      registerError.textContent = message;
      registerError.style.display = message ? 'block' : 'none';
    }

    registerBtn.addEventListener('click', async () => {
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const terms = document.getElementById('terms').checked;

      if (!firstName || !lastName || !email || !password) {
        setError('Please fill in all required fields.');
        return;
      }
      if (password.length < 6) {
        setError('Password must be at least 6 characters long.');
        return;
      }
      if (password !== confirm) {
        setError('Passwords do not match.');
        return;
      }
      if (!terms) {
        setError('You must accept the terms to continue.');
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = 'Creating account...';
      setError('');

      try {
        const response = await fetch('api.php?route=' + encodeURIComponent('/auth/register'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ first_name: firstName, last_name: lastName, email, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Registration failed');

        localStorage.setItem('lh_token', data.token);
        localStorage.setItem('lh_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (error) {
        setError(error.message || 'Registration failed. Please try again.');
        registerBtn.disabled = false;
        registerBtn.textContent = 'Create my account';
      }
    });
  </script>
</body>
</html>
