<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Certificates — GITAcademy</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --ink:#0d0d0f;--cream:#f5f0e8;--gold:#e8c547;--moss:#2d4a3e;
      --rust:#c4522a;--paper:#faf8f3;--smoke:#f0ece4;--mist:#e8e3db;
      --error:#e05555;--success:#2d7a4f;
      --font-display:'Fraunces',Georgia,serif;--font-body:'DM Sans',system-ui,sans-serif;
      --nav-h:64px;
      --shadow-sm:0 2px 8px rgba(13,13,15,.06);--shadow-md:0 4px 20px rgba(13,13,15,.1);--shadow-lg:0 12px 40px rgba(13,13,15,.14);
      --radius-sm:8px;--radius-md:12px;--radius-lg:18px;--radius-xl:24px;
    }
    body{font-family:var(--font-body);background:var(--smoke);color:var(--ink);min-height:100vh}
    a{text-decoration:none;color:inherit}
    button{cursor:pointer;font-family:inherit;border:none;background:none}

    /* ══ NAVBAR (same pattern as saved.html) ══ */
    .navbar{position:sticky;top:0;z-index:500;height:var(--nav-h);background:var(--cream);border-bottom:1px solid rgba(13,13,15,.08);display:flex;align-items:center;padding:0 2rem;gap:1.5rem}
    .nav-logo{font-family:var(--font-display);font-size:1.4rem;font-weight:900;color:var(--ink);letter-spacing:-.03em}
    .nav-logo span{color:var(--rust)}
    .nav-links{display:flex;gap:.25rem}
    .nav-link{font-size:.875rem;font-weight:500;color:rgba(13,13,15,.5);padding:.4rem .8rem;border-radius:var(--radius-md);transition:.15s}
    .nav-link:hover{color:var(--ink);background:var(--smoke)}
    .nav-right{display:flex;align-items:center;gap:.75rem;margin-left:auto}
    .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--moss),var(--rust));display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--cream)}
    .nav-user{display:flex;align-items:center;gap:.5rem;padding:.3rem .5rem .3rem .85rem;border-radius:100px;border:1.5px solid rgba(13,13,15,.1);cursor:pointer;transition:.2s;background:none}
    .nav-user:hover{border-color:var(--ink)}
    .nav-user-name{font-size:.82rem;font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nav-user-wrap{position:relative}
    .user-dropdown{position:absolute;top:calc(100% + .6rem);right:0;background:var(--paper);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);min-width:200px;padding:.5rem;opacity:0;pointer-events:none;transform:translateY(-8px);transition:.2s;z-index:600}
    .user-dropdown.open{opacity:1;pointer-events:all;transform:translateY(0)}
    .dropdown-item{display:flex;align-items:center;gap:.65rem;padding:.6rem .75rem;border-radius:var(--radius-sm);font-size:.85rem;font-weight:500;color:var(--ink);transition:.15s}
    .dropdown-item:hover{background:var(--smoke)}
    .dropdown-item.danger{color:var(--error)}
    .dropdown-item.danger:hover{background:rgba(224,85,85,.08)}
    .dropdown-sep{height:1px;background:rgba(13,13,15,.08);margin:.4rem 0}
    .hamburger{display:none;flex-direction:column;gap:4px;width:22px}
    .hamburger span{height:2px;background:var(--ink);border-radius:2px}

    /* ══ PAGE ══ */
    .page-header{max-width:1000px;margin:0 auto;padding:2.5rem 2rem 1.5rem}
    .page-title{font-family:var(--font-display);font-size:2rem;font-weight:900;letter-spacing:-.02em}
    .page-subtitle{font-size:.9rem;color:rgba(13,13,15,.5);margin-top:.35rem}
    .page-body{max-width:1000px;margin:0 auto;padding:0 2rem 4rem}

    .cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}

    /* Certificate "document" card */
    .cert-doc{background:linear-gradient(135deg,#fffaf0,var(--paper));border:2px solid var(--gold);border-radius:var(--radius-lg);padding:1.75rem;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
    .cert-doc::before{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:radial-gradient(circle,rgba(232,197,71,.25),transparent 70%)}
    .cert-ribbon{font-size:2.2rem;margin-bottom:.6rem}
    .cert-course-title{font-family:var(--font-display);font-size:1.15rem;font-weight:800;line-height:1.3;margin-bottom:.3rem}
    .cert-instructor{font-size:.8rem;color:rgba(13,13,15,.55);margin-bottom:1rem}
    .cert-meta-row{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px dashed rgba(13,13,15,.15);padding-top:.85rem;margin-top:.5rem}
    .cert-id{font-size:.7rem;font-family:monospace;color:rgba(13,13,15,.45)}
    .cert-date{font-size:.75rem;color:rgba(13,13,15,.5)}
    .cert-actions{display:flex;gap:.5rem;margin-top:1rem}
    .btn-cert{flex:1;text-align:center;padding:.55rem;border-radius:100px;font-size:.78rem;font-weight:600;transition:.2s}
    .btn-cert.primary{background:var(--ink);color:var(--cream)}
    .btn-cert.primary:hover{background:var(--rust)}
    .btn-cert.ghost{background:none;border:1.5px solid rgba(13,13,15,.15);color:var(--ink)}
    .btn-cert.ghost:hover{border-color:var(--ink)}

    .empty-state{display:none;text-align:center;padding:4rem 1rem}
    .empty-state.show{display:block}
    .empty-icon{font-size:3.5rem;margin-bottom:1rem}
    .empty-title{font-family:var(--font-display);font-size:1.3rem;font-weight:700;margin-bottom:.4rem}
    .empty-sub{font-size:.9rem;color:rgba(13,13,15,.5);margin-bottom:1.5rem}
    .btn-browse{display:inline-flex;align-items:center;gap:.5rem;background:var(--ink);color:var(--cream);padding:.75rem 1.6rem;border-radius:100px;font-size:.88rem;font-weight:600}
    .btn-browse:hover{background:var(--rust)}

    /* Print / share modal */
    .cert-modal-overlay{position:fixed;inset:0;background:rgba(13,13,15,.6);display:none;align-items:center;justify-content:center;z-index:900;padding:1.5rem}
    .cert-modal-overlay.open{display:flex}
    .cert-modal{background:var(--paper);border-radius:var(--radius-lg);max-width:480px;width:100%;padding:2rem;text-align:center}
    .cert-modal-icon{font-size:3rem;margin-bottom:1rem}
    .cert-modal-close{margin-top:1rem;background:var(--ink);color:var(--cream);padding:.6rem 1.5rem;border-radius:100px;font-size:.85rem;font-weight:600}

    @media(max-width:768px){
      .navbar{padding:0 1rem}
      .nav-links{display:none}
      .hamburger{display:flex}
      .nav-user-name{display:none}
    }
  </style>
</head>
<body>

<nav class="navbar">
  <button class="hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
  <a href="learnhub_responsive.html" class="nav-logo">GIT<span>Academy</span></a>
  <ul class="nav-links">
    <li><a href="home.html" class="nav-link">Browse</a></li>
    <li><a href="category-list.html" class="nav-link">Categories</a></li>
  </ul>
  <div class="nav-right">
    <div class="nav-user-wrap">
      <button class="nav-user" id="userMenuBtn"><span class="nav-user-name" id="navUserName">Account</span><div class="avatar" id="navAvatar">--</div></button>
      <div class="user-dropdown" id="userDropdown">
        <a href="my-courses.html" class="dropdown-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>My Courses</a>
        <a href="saved.html" class="dropdown-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Saved</a>
        <a href="certificates.html" class="dropdown-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></svg>Certificates</a>
        <a href="cart.html" class="dropdown-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>Cart</a>
        <a href="profile.html" class="dropdown-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
        <a href="category-list.html" class="dropdown-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Categories</a>
        <a href="edit-profile.html" class="dropdown-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
        <a href="course-list.html" class="dropdown-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Browse Courses</a>
        <div class="dropdown-sep"></div>
        <a href="login.html" class="dropdown-item danger" id="logoutBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Log Out</a>
      </div>
    </div>
  </div>
</nav>

<div class="page-header">
  <h1 class="page-title">My Certificates</h1>
  <p class="page-subtitle" id="certCount">Loading…</p>
</div>

<div class="page-body">
  <div class="cert-grid" id="certGrid"></div>

  <div class="empty-state" id="emptyState">
    <div class="empty-icon">🎓</div>
    <div class="empty-title">No certificates yet</div>
    <p class="empty-sub">Complete a course from start to finish to earn your first certificate.</p>
    <a href="my-courses.html" class="btn-browse">Go to My Courses</a>
  </div>
</div>

<!-- Share/verify modal (demo) -->
<div class="cert-modal-overlay" id="certModal">
  <div class="cert-modal">
    <div class="cert-modal-icon" id="modalIcon">🔗</div>
    <div id="modalTitle" style="font-family:var(--font-display);font-weight:800;font-size:1.1rem;margin-bottom:.5rem">Link copied!</div>
    <p id="modalBody" style="font-size:.85rem;color:rgba(13,13,15,.55)"></p>
    <button class="cert-modal-close" onclick="document.getElementById('certModal').classList.remove('open')">Close</button>
  </div>
</div>

<script type="module">
  import { userApi } from './api.js';
  import { getUser, redirectIfNotLoggedIn, logout } from './auth.js';

  redirectIfNotLoggedIn('login.html');
  const me = getUser();
  if (me) {
    document.getElementById('navUserName').textContent = me.first_name || 'Account';
    document.getElementById('navAvatar').textContent = ((me.first_name?.[0]||'')+(me.last_name?.[0]||'')).toUpperCase() || 'U';
  }

  document.getElementById('hamburgerBtn').addEventListener('click', () => {});
  const userMenuBtn = document.getElementById('userMenuBtn');
  const userDropdown = document.getElementById('userDropdown');
  userMenuBtn.addEventListener('click', e => { e.stopPropagation(); userDropdown.classList.toggle('open'); });
  document.addEventListener('click', () => userDropdown.classList.remove('open'));
  document.getElementById('logoutBtn').addEventListener('click', e => { e.preventDefault(); logout(); });

  function formatDate(iso) {
    if (!iso) return 'Recently';
    const d = new Date(iso.replace(' ', 'T'));
    if (isNaN(d)) return 'Recently';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  async function load() {
    let certs = [];
    try {
      certs = (await userApi.certificates()).certificates || [];
    } catch (err) {
      certs = [];
    }

    document.getElementById('certCount').textContent = `${certs.length} certificate${certs.length===1?'':'s'} earned`;
    document.getElementById('emptyState').classList.toggle('show', certs.length === 0);
    document.getElementById('certGrid').style.display = certs.length === 0 ? 'none' : '';

    document.getElementById('certGrid').innerHTML = certs.map(c => `
      <div class="cert-doc">
        <div class="cert-ribbon">${c.emoji || '🎓'}</div>
        <div class="cert-course-title">${c.course_title}</div>
        <div class="cert-instructor">Instructed by ${c.instructor_name || 'GITAcademy'}</div>
        <div class="cert-meta-row">
          <div>
            <div class="cert-id">Credential ${c.credential_id}</div>
            <div class="cert-date">Issued ${formatDate(c.issued_at)}</div>
          </div>
        </div>
        <div class="cert-actions">
          <button class="btn-cert primary" data-verify="${c.credential_id}">Verify / Share</button>
          <a href="course-details.html?id=${c.course_id}" class="btn-cert ghost">View Course</a>
        </div>
      </div>`).join('');

    document.querySelectorAll('[data-verify]').forEach(btn => {
      btn.addEventListener('click', () => {
        const url = `${window.location.origin}${window.location.pathname}?verify=${btn.dataset.verify}`;
        navigator.clipboard?.writeText(url).catch(() => {});
        document.getElementById('modalTitle').textContent = 'Verification link copied!';
        document.getElementById('modalBody').textContent = `Credential ${btn.dataset.verify} — share this link so anyone can verify you completed this course. (Demo: link copies to clipboard; no public verification server is hosted in this environment.)`;
        document.getElementById('certModal').classList.add('open');
      });
    });
  }

  load();
</script>
</body>
</html>
