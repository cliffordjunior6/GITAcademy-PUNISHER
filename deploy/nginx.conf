# Real production nginx config for GITAcademy.
# This replaces router.php (which is explicitly documented as dev/demo-only,
# since PHP's built-in server is not fit for production traffic).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/gitacademy
#   sudo ln -s /etc/nginx/sites-available/gitacademy /etc/nginx/sites-enabled/
#   sudo nano /etc/nginx/sites-available/gitacademy   # fill in your domain + paths
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires php-fpm running (see deploy/gitacademy.service, or your distro's
# php8.3-fpm package/service) and a real TLS certificate — e.g.:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP to HTTPS once you have a real certificate (certbot
    # will usually add this block for you automatically).
    # return 301 https://$host$request_uri;

    root /var/www/gitacademy;
    index index.html;

    # Never serve secrets, source config, or the legacy scaffold as static files
    location ~ /\. {
        deny all;
        return 404;
    }
    location ^~ /_legacy-laravel-scaffold/ {
        deny all;
        return 404;
    }
    # Real uploaded video files — served directly by nginx (fast), not PHP
    location ^~ /uploads/ {
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # API — everything under /api goes to the real PHP backend.
    # Block direct access to internal PHP source files; only index.php is a
    # valid entrypoint.
    location ~ ^/api/(bootstrap|env|mailer|paystack|seed|schema)\.(php|sql)$ {
        deny all;
        return 404;
    }

    location ^~ /api/ {
        try_files $uri /api/index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.3-fpm.sock; # adjust to your php-fpm socket/version
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
            client_max_body_size 220M; # allow real video uploads; matches UPLOADS_MAX_MB in .env
        }
    }

    # Everything else — the static frontend
    location / {
        try_files $uri $uri.html /index.html;
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 1024;

    access_log /var/log/nginx/gitacademy.access.log;
    error_log  /var/log/nginx/gitacademy.error.log;
}
